name: 'Prod-Mill Engine'
description: 'The core logic for the prodmill-engine.'
inputs:
  mode:
    description: 'The operation mode. Either "create-spec", "create-plan", "create-tasks", "next-task", "update-constitution", or "update-spec-list".'
    required: true
  jules_api_key:
    description: 'API key for the Jules service, used for the "create-spec", "create-tasks", and "update-constitution" modes.'
    required: false
  issue_body:
    description: 'The body of the GitHub issue.'
    required: false
  issue_number:
    description: 'The number of the GitHub issue. Required for "create-spec", "create-plan", "create-tasks", and "update-constitution" modes.'
    required: false
outputs:
  issue_id:
    description: 'The ID of the issue being processed.'
runs:
  using: 'docker'
  image: 'Dockerfile'
